<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Codice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --parchment: #f7f2e6;
    --parchment-dark: #efe8d7;
    --ink: #2b2015;
    --ink-soft: #55483a;
    --rule: #c9b587;
    --burgundy: #6e1f1f;
    --burgundy-dark: #501515;
    --gold: #9c7a3c;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    height:100vh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.05), transparent 55%),
      linear-gradient(160deg, #1c130c 0%, #120b07 55%, #0a0604 100%);
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding: 26px;
    perspective: 2400px;
  }

  .app{
    display:flex;
    width:100%;
    height:88%;
    max-width: 1400px;
    border-radius: 6px 14px 14px 6px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.65),
      0 8px 18px rgba(0,0,0,0.5);
    position: relative;
    isolation: isolate;
    animation: liftBook 1.7s ease-out both;
    transform-style: preserve-3d;
  }

  @keyframes liftBook{
    0%{ box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    100%{
      box-shadow:
        0 30px 70px rgba(0,0,0,0.65),
        0 8px 18px rgba(0,0,0,0.5);
    }
  }

  /* dorso del libro: ombra centrale che finge la piega tra le due pagine */
  .app::before{
    content:"";
    position:absolute;
    top:0; bottom:0;
    left: 300px;
    width: 34px;
    margin-left: -17px;
    background: linear-gradient(90deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.08) 40%,
      rgba(0,0,0,0.14) 50%,
      rgba(0,0,0,0.08) 60%,
      rgba(0,0,0,0) 100%);
    pointer-events:none;
    z-index: 4;
    opacity: 0;
    animation: fadeInSpine 1.25s ease-out both;
    animation-delay: .25s;
  }

  @keyframes fadeInSpine{
    to{ opacity: 1; }
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width: 300px;
    flex-shrink:0;
    background: var(--parchment-dark);
    border-right: 1px solid var(--rule);
    padding: 0;
    overflow-y:auto;
    border-radius: 0 0 0 6px;
    transform-origin: right center;
    animation: openLeftPage 1.25s cubic-bezier(.22,.68,.2,1) both;
    animation-delay: .25s;
    backface-visibility: hidden;
  }

  @keyframes openLeftPage{
    0%{
      transform: rotateY(-108deg);
      filter: brightness(.45);
    }
    70%{
      filter: brightness(.9);
    }
    100%{
      transform: rotateY(0deg);
      filter: brightness(1);
    }
  }

  .testament-switch{
    display:flex;
    justify-content:flex-start;
    gap: 0;
    padding: 0 0 26px 0;
    margin-bottom: 6px;
    align-items:flex-start;
  }
  .testament-btn{
    position:relative;
    z-index: 6;
    flex: 0 0 150px;
    width: 150px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 1rem;
    line-height: 1.25;
    letter-spacing: 0.05em;
    color: #f5ecd8;
    border-radius: 0;
    padding: 8px 8px 35px 8px;
    cursor:pointer;
    text-align:center;
    word-break: break-word;
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    box-shadow: 0 6px 12px rgba(0,0,0,0.28);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, padding-bottom .3s ease;
  }
  .testament-btn:nth-child(1),
  .testament-btn:nth-child(2){ background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%); }



  /* Antico Testamento: superficie consumata, come pergamena invecchiata, con polvere che si muove appena */
  .testament-btn:nth-child(1){
    filter: saturate(.78) sepia(.14) contrast(.95);
    overflow:hidden;
  }
  .testament-btn:nth-child(1)::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.07) 0px, rgba(0,0,0,0.07) 1px, transparent 1px, transparent 6px),
      radial-gradient(ellipse at 50% 35%, transparent 42%, rgba(0,0,0,0.38) 100%);
    background-size: 180% 180%, 180% 180%, 100% 100%;
    mix-blend-mode: multiply;
    pointer-events:none;
    animation: dustDrift 11s ease-in-out infinite alternate;
  }
  @keyframes dustDrift{
    0%{ background-position: 0% 0%, 0% 0%, 0 0; }
    100%{ background-position: 3% 2%, -2.5% -1.5%, 0 0; }
  }

  /* Nuovo Testamento: riflesso appena percettibile, come inchiostro fresco */
  .testament-btn:nth-child(2){
    filter: saturate(1.1) brightness(1.03);
    overflow:hidden;
  }
  .testament-btn:nth-child(2)::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(125deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0) 58%);
    background-size: 260% 260%;
    background-position: 0% 0%;
    pointer-events:none;
    animation: shineSweep 5s ease-in-out infinite;
  }
  @keyframes shineSweep{
    0%, 100%{ background-position: -60% -60%; }
    50%{ background-position: 120% 120%; }
  }

  .testament-btn:hover{
    padding-bottom: 50px;
  }
  .testament-btn:nth-child(1):hover{ filter: saturate(.78) sepia(.14) contrast(.95) brightness(1.1); }
  .testament-btn:nth-child(2):hover{ filter: saturate(1.1) brightness(1.1); }

  .testament-btn.active{
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .testament-btn:nth-child(1).active{ filter: saturate(.78) sepia(.14) contrast(.95) brightness(1.16); }
  .testament-btn:nth-child(2).active{ filter: saturate(1.1) brightness(1.15); }

  /* Elenco nomi che compare dentro il pulsante, solo per quello sotto hover */
  .testament-dropdown{
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display:flex;
    flex-direction:column;
    gap: 10px;
    padding-top: 0;
    transition: max-height .35s ease, opacity .25s ease .05s, padding-top .35s ease;
  }
  .testament-btn:hover .testament-dropdown{
    max-height: 400px;
    opacity: 1;
    padding-top: 50px;
  }
  .dropdown-preview{
    background: none;
    color: #f5ecd8;
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: .92rem;
    line-height:1.2;
    padding: 3px 6px;
    cursor: default;
    word-break: break-word;
  }

  .sidebar-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--burgundy);
    padding: 0 26px 10px 26px;
    margin-top: 22px;
    border-bottom: 1px solid var(--rule);
  }
  .sidebar-title:first-child{ margin-top:0; }

  .entry{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    font-family:'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--ink-soft);
    padding: 13px 26px;
    cursor:pointer;
    position:relative;
    transition: background .15s ease, color .15s ease, padding-left .15s ease;
  }
  .entry:hover{
    background: rgba(110,31,31,0.07);
    color: var(--ink);
    padding-left: 32px;
  }
  .entry.active{
    background: rgba(110,31,31,0.13);
    color: var(--burgundy);
    font-weight:600;
    padding-left: 32px;
  }
  .entry.active::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background: var(--burgundy);
  }

  .entry-large{
    font-size: 1.25rem;
    padding: 14px 26px;
    line-height: 1.15;
  }
  .entry-large:hover, .entry-large.active{
    padding-left: 34px;
  }

  /* ---------- READING PANE ---------- */
  .reader{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    padding: 0;
    background: var(--parchment);
    border-radius: 0 14px 14px 0;
    overflow:hidden;
    transform-origin: left center;
    animation: openRightPage 1.25s cubic-bezier(.22,.68,.2,1) both;
    animation-delay: .25s;
    backface-visibility: hidden;
  }

  @keyframes openRightPage{
    0%{
      transform: rotateY(108deg);
      filter: brightness(.45);
    }
    70%{
      filter: brightness(.9);
    }
    100%{
      transform: rotateY(0deg);
      filter: brightness(1);
    }
  }

  .reader-inner{
    flex:1;
    overflow-y:auto;
    padding: 70px 40px 70px 0;
    display:flex;
    align-items:flex-start;
    direction: rtl;
  }

  .card{
    max-width: 780px;
    width: 100%;
    margin: 0 auto 0 77px;
    animation: fadeIn .35s ease;
    direction: ltr;
    text-align: left;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card-label{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .card h1{
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 3rem;
    margin: 0 0 28px 0;
    color: var(--ink);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 18px;
  }

  .card p{
    font-size: 1.22rem;
    line-height: 1.78;
    color: var(--ink-soft);
    margin: 0 0 20px 0;
  }

  .card .subtitle{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.38rem;
    color: var(--gold);
    margin: -18px 0 26px 0;
  }

  .card .divider{
    text-align:center;
    color: var(--gold);
    font-size: 1.3rem;
    margin: 44px 0 18px 0;
    letter-spacing: 0.3em;
  }

  .card h2{
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.8rem;
    color: var(--burgundy);
    margin: 0 0 4px 0;
  }

  .card .h2-sub{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.12rem;
    color: var(--ink-soft);
    margin: 0 0 16px 0;
    opacity: .8;
  }

  .card h3{
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.32rem;
    color: var(--ink);
    margin: 26px 0 10px 0;
  }

  .card blockquote{
    margin: 18px 0;
    padding: 14px 22px;
    background: rgba(156,122,60,0.08);
    border-left: 3px solid var(--gold);
    font-style: italic;
    font-size: 1.12rem;
    line-height: 1.68;
    color: var(--ink);
  }
  .card blockquote cite{
    display:block;
    margin-top: 8px;
    font-style: normal;
    font-size: .95rem;
    letter-spacing: 0.04em;
    color: var(--gold);
    text-align:right;
  }

  .card ul, .card ol{
    margin: 0 0 20px 0;
    padding-left: 22px;
    color: var(--ink-soft);
    font-size: 1.17rem;
    line-height: 1.72;
  }
  .card ul li, .card ol li{ margin-bottom: 6px; }
  .card ul li strong, .card ol li strong{ color: var(--ink); }

  .card table{
    width:100%;
    border-collapse: collapse;
    margin: 18px 0 28px 0;
    font-size: 1.02rem;
  }
  .card table th, .card table td{
    border: 1px solid var(--rule);
    padding: 8px 10px;
    text-align:left;
    vertical-align: top;
  }
  .card table th{
    background: rgba(110,31,31,0.08);
    color: var(--burgundy);
    font-family:'Cormorant Garamond', serif;
    letter-spacing: 0.03em;
  }
  .card table td{ color: var(--ink-soft); }

  .placeholder{
    color: var(--ink-soft);
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.3rem;
    opacity: .6;
  }

  /* ---------- LINGUETTA "STUDIO BIBLICO" ---------- */
  .tab-toggle{
    position:absolute;
    bottom: 100%;
    left: 300px;
    background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
    color: #f5ecd8;
    border:none;
    font-family:'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: .05em;
    padding: 11px 24px 12px 24px;
    cursor:pointer;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
    transition: background .15s ease, padding-top .15s ease;
    z-index: 6;
    opacity: 0;
    animation: fadeInSpine 1.25s ease-out both;
    animation-delay: .25s;
  }
  .tab-toggle:hover{
    background: linear-gradient(180deg, var(--burgundy-dark) 0%, #3a0f0f 100%);
    padding-top: 16px;
  }
  .tab-label{
    display:inline-block;
    transition: transform .15s ease;
  }
  .tab-toggle:hover .tab-label{
    transform: translateY(-5px);
  }

  /* ---------- LINGUETTE ATTI ---------- */
  .act-tabs{
    position:absolute;
    top: 34px;
    right: 0;
    display:flex;
    flex-direction:column;
    gap: 14px;
    z-index: 5;
  }
  .act-tab{
    border:none;
    color:#f5ecd8;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 1.23rem;
    letter-spacing: .04em;
    padding: 14px 12px 14px 18px;
    min-width: 66px;
    text-align:center;
    border-radius: 12px 0 0 12px;
    cursor:pointer;
    box-shadow: -4px 4px 12px rgba(0,0,0,0.28);
    transition: transform .15s ease, min-width .15s ease, padding .15s ease;
    opacity: 0;
    animation: fadeInTab .4s ease forwards;
  }
  .act-tab:hover{
    transform: translateX(-8px);
  }
  @keyframes fadeInTab{
    to{ opacity: 1; }
  }

  /* view 2 has no subdivision, just one flat list */
  .sidebar.flat .sidebar-title{ display:none; }

  ::-webkit-scrollbar{ width: 10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--rule); border-radius: 10px; }
</style>
</head>
<body>

<div class="app">
  <button class="tab-toggle" id="tabToggle"><span class="tab-label">Studio biblico</span></button>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="reader">
    <div class="act-tabs" id="actTabs"></div>
    <div class="reader-inner">
      <div class="card" id="card">
        <div class="placeholder">Seleziona una voce dal margine per leggere il testo.</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- DATI ----
  // Vista 1: due testamenti selezionabili come pulsanti, ognuno con le proprie voci
  const view1 = {
    testaments: {
      "Antico Testamento": [
        { name: "Giuseppe", text: `
          <div class="subtitle" id="giuseppe-intro">Il Tessitore di Sogni</div>
          <p>Giuseppe nacque nelle terre di Canaan, figlio primogenito di Giacobbe e della sua amata Rachele, in una famiglia segnata da grandi promesse divine. Nelle terre dorate di Canaan, dove il vento sussurra tra i rami dei terebinti, viveva questo giovane la cui anima era intessuta di visioni. Giuseppe, il figlio prediletto, non camminava solo sulla terra brulla; egli abitava un regno di simboli e presagi. La sua tunica, un mosaico di colori che sembrava aver rubato le sfumature all'alba e al tramonto, era il vessillo del suo destino e la scintilla che accese l'invidia dei suoi fratelli.</p>

          <h3>Sintesi cronologica</h3>
          <ul>
            <li><strong>Nascita e predilezione:</strong> il figlio prediletto di Giacobbe riceve la tunica dalle lunghe maniche (Genesi 37:3).</li>
            <li><strong>Tradimento e schiavitù:</strong> venduto dai fratelli ai mercanti ismaeliti per venti sicli d'argento (Genesi 37:28).</li>
            <li><strong>Ascesa a viceré e perdono:</strong> nominato governatore d'Egitto dal Faraone, si rivela infine ai suoi fratelli riconciliandosi con loro (Genesi 41:41; 45:1-15).</li>
            <li><strong>Morte e promessa del ritorno:</strong> muore all'età di centodieci anni, lasciando la speranza del ritorno nella terra dei padri (Genesi 50:26).</li>
          </ul>

          <div class="divider">&#10070;</div>
          <h2 id="giuseppe-1">I Sogni della Giovinezza</h2>
          <div class="h2-sub">Canaan</div>
          <p>Una notte, sotto un manto di stelle infinite, Giuseppe sognò dei covoni di grano in un campo. Il suo covone si ergeva fiero al centro, mentre quelli dei suoi fratelli lo circondavano e si inchinavano in un silenzioso atto di sottomissione (Genesi 37:5-7). Questa prima visione simboleggiava in modo inequivocabile il futuro dominio materiale e politico di Giuseppe sui suoi consanguinei. Poco dopo, una seconda visione ancor più grandiosa illuminò il suo sonno: il sole, la luna e undici stelle rendevano omaggio alla sua luce (Genesi 37:9). Quest'immagine rappresentava l'intera famiglia patriarcale, inclusi i genitori e tutti i fratelli, prostrati dinanzi alla sua futura gloria.</p>
          <p>Erano sogni di esaltazione, ma anche semi di discordia: pur essendo autentici messaggi profetici inviati dalla divinità per annunciare il suo ruolo di salvatore e guida, vennero percepiti dai fratelli solo come deliri di grandezza. L'invidia, come una ruggine silenziosa, consumò il loro cuore finché, in un giorno di calura opprimente, Giuseppe raggiunse i fratelli a Dotan. Lì, essi complottarono contro di lui: lo spogliarono con violenza della sua tunica colorata e lo gettarono nell'oscurità di una cisterna vuota e senz'acqua (Genesi 37:23-24). Poco dopo, scorgendo una carovana di Ismaeliti diretta verso sud, decisero di trarne profitto vendendo il proprio fratello come schiavo per venti sicli d'argento (Genesi 37:28). Per celare l'infamia e ingannare il padre Giacobbe, macchiarono la veste di Giuseppe con il sangue di un capro, lasciandogli credere che una fiera lo avesse sbranato (Genesi 37:31).</p>

          <div class="divider">&#10070;</div>
          <h2 id="giuseppe-2">L'Ombra del Nilo</h2>
          <div class="h2-sub">Egitto &middot; Casa di Putifarre</div>
          <p>L'Egitto accolse Giuseppe con il calore delle sue sabbie e la maestosità delle sue pietre. Da principe di Canaan a schiavo nella casa di Putifarre, Giuseppe non smarrì mai la sua integrità. Tuttavia, il destino è un sentiero tortuoso. Accusato ingiustamente, si ritrovò nelle profondità di una prigione, dove l'oscurità avrebbe potuto inghiottire chiunque.</p>
          <blockquote>Ma Giuseppe portava la luce dentro di sé, poiché il Signore era con lui e riversava su di lui la sua grazia.<cite>Genesi 39:21</cite></blockquote>
          <p>Fu tra quelle mura fredde che la sua fama di interprete di sogni iniziò a diffondersi, ridonando speranza a chi aveva perso il domani.</p>

          <div class="divider">&#10070;</div>
          <h2 id="giuseppe-3">La Visione del Faraone</h2>
          <div class="h2-sub">Il Palazzo Reale</div>
          <p>Il Faraone, signore delle Due Terre, era tormentato da visioni che i suoi saggi non sapevano decifrare. Giuseppe, dopo essere stato chiamato in fretta dalla prigione, si purificò e cambiò veste per presentarsi con dignità dinanzi al trono. Quando il sovrano gli chiese di interpretare i sogni, Giuseppe rispose con profonda umiltà:</p>
          <blockquote>«Non io; Dio darà la risposta che procura benessere al faraone.»<cite>Genesi 41:16</cite></blockquote>
          <p>Egli spiegò che le visioni delle sette vacche e delle sette spighe belle rappresentavano sette anni di straordinaria abbondanza, seguiti da sette anni di una carestia così devastante da far dimenticare ogni ricchezza (Genesi 41:25-31). Con audacia ispirata, Giuseppe propose un piano di gestione rigoroso: prelevare un quinto dei prodotti durante gli anni buoni e accumulare riserve di grano sotto l'autorità regale (Genesi 41:33-36). Colpito dall'intelligenza del giovane, in cui riconobbe la guida dello Spirito di Dio, il Faraone lo scelse immediatamente per attuare il piano, elevandolo sopra tutto il popolo d'Egitto (Genesi 41:37-41).</p>
          <p>Non era solo una spiegazione; era una profezia di salvezza.</p>

          <div class="divider">&#10070;</div>
          <h2 id="giuseppe-4">Il Viceré e la Provvidenza</h2>
          <div class="h2-sub">L'Egitto degli anni della carestia</div>
          <p>Impressionato dalla saggezza del giovane straniero, il Faraone lo nominò Viceré d'Egitto, affidandogli l'anello sigillo e le sorti del regno. Giuseppe divenne l'amministratore della vita. Durante gli anni di abbondanza, accumulò grano in quantità tali da coprire le dune del deserto. Quando la carestia colpì, i popoli di ogni terra vennero a bussare alle porte dell'Egitto.</p>
          <p>Tra coloro che cercavano pane, giunsero anche i suoi fratelli. Giuseppe li riconobbe subito, ma si finse estraneo, parlando loro con durezza attraverso un interprete per non svelarsi. Egli li accusò apertamente di essere spie venute per esplorare i punti deboli del paese (Genesi 42:9-14), costringendoli a difendere la propria onestà rievocando la loro storia familiare. Per mettere alla prova la loro veridicità, Giuseppe impose una condizione severa: trattenne Simeone in catene come ostaggio nelle prigioni egiziane (Genesi 42:24), ordinando agli altri di tornare in Canaan e condurre dinanzi a lui Beniamino, il fratello minore rimasto con il padre (Genesi 42:20).</p>
          <p>Il culmine di questo percorso giunse con lo stratagemma della coppa d'argento, che Giuseppe fece nascondere segretamente nel sacco di Beniamino (Genesi 44:1-2). Quando la coppa fu rinvenuta, Giuseppe minacciò di rendere schiavo solo il più giovane, offrendo ai fratelli l'occasione perfetta per abbandonarlo come avevano fatto anni prima con lui (Genesi 44:17). Tuttavia, la loro risposta fu diversa: essi implorarono pietà e Giuda si offrì di prendere il posto di Beniamino, dimostrando un amore sacrificale che non conoscevano in gioventù. Queste prove non erano atti di vendetta, ma una precisa architettura spirituale volta a verificare la loro trasformazione profonda e la loro redenzione; solo dopo aver visto la loro volontà di proteggere il fratello a costo della propria vita, Giuseppe scelse di rivelarsi, suggellando il perdono in un momento di incontenibile commozione.</p>
          <blockquote>«Non siete stati voi a mandarmi qui, ma Dio, per conservare la vita.»<cite>Genesi 45:5</cite></blockquote>
          <p>Così, il sognatore divenne il salvatore, e il viaggio iniziato nel buio di un pozzo si concluse nel tripudio di un popolo nutrito e di una famiglia ritrovata.</p>

          <div class="divider">&#10070;</div>
          <h2 id="giuseppe-epilogo">Epilogo</h2>
          <div class="h2-sub">Sintesi e riferimenti</div>
          <table>
            <thead>
              <tr><th>Fase del viaggio</th><th>Luogo</th><th>Ruolo</th><th>Significato</th></tr>
            </thead>
            <tbody>
              <tr><td>La Visione</td><td>Canaan</td><td>Figlio Prediletto</td><td>Il dono della profezia e il costo dell'invidia.</td></tr>
              <tr><td>La Prova</td><td>Egitto (Prigione)</td><td>Servo / Prigioniero</td><td>La tempra del carattere nel silenzio e nell'ingiustizia.</td></tr>
              <tr><td>L'Ascesa</td><td>Palazzo Reale</td><td>Viceré</td><td>La saggezza al servizio della sopravvivenza collettiva.</td></tr>
              <tr><td>La Redenzione</td><td>Granai d'Egitto</td><td>Salvatore</td><td>Il perdono che ricompone i frammenti del passato.</td></tr>
            </tbody>
          </table>
          <p>Giuseppe trascorse i suoi ultimi anni nella terra di Gosen, circondato dall'affetto della sua famiglia e vedendo i figli di Efraim fino alla terza generazione. Giunto all'età di centodieci anni, sentendo la fine avvicinarsi, egli non dimenticò la promessa fatta da Dio ai suoi padri. Prima di spirare, chiese ai figli d'Israele di prestare un giuramento solenne: quando Dio li avrebbe visitati per riportarli nella terra promessa, essi avrebbero dovuto portare con sé le sue ossa fuori dall'Egitto (Genesi 50:22-26). Fu così imbalsamato e deposto in un sarcofago, un seme di speranza piantato in terra straniera in attesa del ritorno a casa.</p>
          <p>La figura di Giuseppe rimane uno dei pilastri più luminosi della narrazione biblica, rappresentando il modello supremo della Divina Provvidenza: ciò che gli uomini avevano tramato per il male, Dio lo ha trasformato in bene per salvare un popolo numeroso (Genesi 50:20). Egli incarna la forza del perdono capace di guarire ferite profonde e funge da ponte vitale tra l'epoca dei Patriarchi e l'imminente epopea dell'Esodo. La sua vita insegna che l'integrità e la fede, mantenute anche nelle prove più oscure, sono gli strumenti attraverso cui il destino si compie, trasformando un sognatore tradito nel custode della sopravvivenza di Israele.</p>
        `,
          acts: [

            { label: "I Sogni",         target: "giuseppe-1",        color: "#a15e2a" },

            { label: "Epilogo",         target: "giuseppe-epilogo",  color: "#5f1f48" }

        },
        { name: "Mosè", text: `
          <div class="subtitle" id="intro-top">Una vita in tre quarantenni</div>
          <p>La vita di Mosè non è solo un racconto biografico, ma una monumentale opera teologica e letteraria. La tradizione biblica la suddivide geometricamente in tre blocchi perfetti di 40 anni ciascuno, in cui Mosè cambia radicalmente identità: prima principe, poi pastore, infine leader e profeta.</p>
          <p>Ecco l'intera esistenza di Mosè argomentata passo dopo passo, dall'intreccio della sua nascita fino all'ultimo respiro sul Monte Nebo, con i passi biblici chiave.</p>

          <div class="divider">&#10070;</div>
          <h2 id="atto-1">Atto I</h2>
          <div class="h2-sub">Il Principe d'Egitto e la crisi d'identità · 0-40 anni</div>
          <p>Mosè nasce in un clima di terrore: il Faraone, temendo la crescita demografica degli ebrei ridotti in schiavitù, ordina l'infanticidio di tutti i maschi. La madre di Mosè, Iocebed, compie un atto di disperata fiducia nel destino.</p>
          <blockquote>«Non potendo più tenerlo nascosto, prese per lui un cestello di papiro, lo spalmò di bitume e di pece, vi mise dentro il bambino e lo depose fra i giunchi sulla riva del Nilo.»<cite>Esodo 2:3</cite></blockquote>
          <p>Trovato dalla figlia del Faraone, viene chiamato Mosè (che in egiziano evoca il concetto di "figlio", mentre l'etimologia ebraica popolare lo traduce con "salvato dalle acque"). Cresce alla corte reale, ricevendo la migliore educazione del mondo antico. Tuttavia, l'artificiosa identità egiziana crolla di colpo quando si scontra con la realtà del suo sangue e dell'oppressione del suo popolo.</p>
          <blockquote>«Un giorno Mosè, cresciuto in età, uscì a trovare i suoi fratelli e notò i loro gravami. Vide un Egiziano che percuoteva un Ebreo, uno dei suoi fratelli. Voltatosi attorno e visto che non c'era nessuno, colpì a morte l'Egiziano e lo seppellì nella sabbia.»<cite>Esodo 2:11-12</cite></blockquote>
          <h3>L'argomentazione</h3>
          <p>Questo omicidio rappresenta il punto di svolta cruciale. Mosè tenta inizialmente una liberazione politica impulsiva, ma si scontra con il rifiuto del suo stesso popolo:</p>
          <ul>
            <li><strong>Il fallimento del tentativo umano:</strong> gli ebrei lo mettono in discussione chiedendo «Chi ti ha costituito capo e giudice su di noi?».</li>
            <li><strong>La fuga strategica:</strong> braccato dal Faraone, Mosè abbandona lo status regale per rifugiarsi nel deserto.</li>
          </ul>

          <div class="divider">&#10070;</div>
          <h2 id="atto-2">Atto II</h2>
          <div class="h2-sub">Il Pastore a Madian e la chiamata divina · 40-80 anni</div>
          <p>Mosè si rifugia nella terra di Madian. Lì difende le figlie del sacerdote Ietro da alcuni pastori prepotenti, sposa una di loro, Sefora, e diventa un semplice pastore di greggi. Per quarant'anni vive nel silenzio, nell'anonimato e nell'umiltà del deserto, dimenticato dall'Egitto e apparentemente senza futuro.</p>
          <p>Finché, sul monte Oreb, la sua routine viene spezzata da un fenomeno paranormale: un roveto che brucia senza consumarsi.</p>
          <blockquote>«L'angelo del Signore gli apparve in una fiamma di fuoco in mezzo a un roveto. Egli guardò ed ecco: il roveto ardeva per il fuoco, ma il roveto non si consumava. [...] Dio lo chiamò dal mezzo del roveto e disse: "Mosè, Mosè!". Rispose: "Eccomi!".»<cite>Esodo 3:2-4</cite></blockquote>
          <p>In questo incontro, Dio affida a Mosè il compito di guidare l'Esodo, rivelando aspetti fondamentali del piano divino:</p>
          <ul>
            <li><strong>L'ascolto del dolore:</strong> Dio dichiara di aver udito il grido degli israeliti.</li>
            <li><strong>La rivelazione del Nome:</strong> il misterioso "Io sono colui che sono" diventa il fondamento dell'identità di Dio nella storia.</li>
          </ul>
          <blockquote>«Dio disse a Mosè: "Io sono colui che sono!". Poi disse: "Dirai agli israeliti: Io-Sono mi ha mandato a voi".»<cite>Esodo 3:14</cite></blockquote>
          <h3>L'argomentazione</h3>
          <p>I secondi quarant'anni servono a "svuotare" Mosè del suo orgoglio egiziano. Il principe che un tempo usava la violenza ora è un uomo timorato e balbuziente. È proprio in questa debolezza che Dio lo sceglie: la liberazione d'Israele non sarà un'opera militare di Mosè, ma una manifestazione della potenza divina.</p>

          <div class="divider">&#10070;</div>
          <h2 id="atto-3">Atto III</h2>
          <div class="h2-sub">L'Esodo, la Legge e il Deserto · 80-120 anni</div>
          <p>Mosè torna in Egitto insieme al fratello Aronne. Davanti all'ostinazione del Faraone, l'Egitto viene devastato dalle dieci piaghe. Dopo l'ultima piaga (la morte dei primogeniti), il Faraone cede. Il popolo parte, ma viene subito braccato dall'esercito egiziano alle spalle, con il Mar Rosso davanti. È il momento del miracolo più celebre:</p>
          <blockquote>«Allora Mosè stese la mano sul mare. E il Signore sospinse il mare con un forte vento d'oriente durato tutta la notte, e rendette il mare asciutto; le acque si divisero. Gli israeliti entrarono in mezzo al mare all'asciutto, mentre le acque erano per loro come un muro a destra e a sinistra.»<cite>Esodo 14:21-22</cite></blockquote>
          <p>Una volta superato il mare, Mosè conduce il popolo al Monte Sinai, dove riceve i Dieci Comandamenti e stabilisce la teocrazia d'Israele.</p>
          <blockquote>«Dio allora pronunciò tutte queste parole: "Io sono il Signore, tuo Dio, che ti ho fatto uscire dalla terra d'Egitto, dalla condizione di schiavitù: Non avrai altri dei di fronte a me..."»<cite>Esodo 20:1-3</cite></blockquote>
          <h3>Il dramma del deserto e la colpa di Meriba</h3>
          <p>La marcia verso la Terra Promessa si trasforma in un calvario lungo quarant'anni a causa delle costanti ribellioni, nostalgie dell'Egitto e idolatrie (come il vitello d'oro) del popolo. Verso la fine del viaggio, presso le acque di Meriba, la pazienza di Mosè cede definitivamente di fronte alle proteste per la mancanza d'acqua.</p>
          <p>Anziché limitarsi a parlare alla roccia come ordinato da Dio, Mosè la colpisce con rabbia e arroganza:</p>
          <blockquote>«Mosè alzò la mano, percosse la roccia con il suo bastone due volte e ne uscì acqua in abbondanza [...]. Ma il Signore disse a Mosè e ad Aronne: "Poiché non avete avuto fiducia in me, per manifestare la mia santità agli occhi degli israeliti, voi non introdurrete quest'assemblea nel paese che io le do".»<cite>Numeri 20:11-12</cite></blockquote>
          <p>L'incidente di Meriba mette in luce la fragilità del leader:</p>
          <ul>
            <li><strong>La mancanza di fede:</strong> Mosè e Aronne attribuiscono a se stessi l'estrazione dell'acqua ("vi faremo noi uscire acqua").</li>
            <li><strong>La conseguenza:</strong> nonostante la fedeltà di una vita, la condanna è categorica: vedere la meta senza potervi entrare.</li>
          </ul>

          <div class="divider">&#10070;</div>
          <h2 id="atto-4">Atto IV</h2>
          <div class="h2-sub">Gli ultimi giorni e la morte sul Monte Nebo · 120 anni</div>
          <p>Arrivato alle porte di Canaan, nelle pianure di Moab, Mosè sa che la sua ora è giunta. Spende i suoi ultimi sprazzi di energia per scrivere la Legge, benedire le dodici tribù e nominare ufficialmente il suo successore, Giosuè.</p>
          <p>Poi, obbedendo all'ultimo comando, sale in solitudine sul Monte Nebo.</p>
          <blockquote>«Mosè salì dalle pianure di Moab sul monte Nebo, in vetta al Pisga, che è di fronte a Gerico. E il Signore gli fece vedere tutto il paese [...]. Il Signore gli disse: "Questo è il paese per il quale io ho giurato ad Abramo, a Isacco e a Giacobbe, dicendo: 'Io lo darò alla tua discendenza'. Io te l'ho fatto vedere con i tuoi occhi, ma tu non vi entrerai".»<cite>Deuteronomio 34:1-4</cite></blockquote>
          <p>Mosè muore lì, a 120 anni, sul confine tra il viaggio e la meta, tra la promessa e il suo adempimento.</p>
          <blockquote>«Mosè, servo del Signore, morì là, nel paese di Moab, come il Signore aveva comandato. E fu sepolto nella valle, nel paese di Moab, di fronte a Bet-Peor; e nessuno fino a oggi ha mai saputo dove sia la sua tomba. Mosè aveva centovent'anni quando morì; la vista non gli si era indebolita e il vigore non gli era venuto meno.»<cite>Deuteronomio 34:5-7</cite></blockquote>

          <div class="divider">&#10070;</div>
          <h2 id="epilogo">Epilogo</h2>
          <div class="h2-sub">Sintesi e riferimenti</div>
          <table>
            <thead>
              <tr><th>Fase della vita</th><th>Età</th><th>Ruolo principale</th><th>Luogo chiave</th><th>Evento teologico/politico</th></tr>
            </thead>
            <tbody>
              <tr><td>1° Quarantennio</td><td>0-40 anni</td><td>Principe d'Egitto</td><td>Egitto (corte reale)</td><td>Rottura con l'Egitto, omicidio della guardia, fuga.</td></tr>
              <tr><td>2° Quarantennio</td><td>40-80 anni</td><td>Pastore / Esiliato</td><td>Terra di Madian / Sinai</td><td>Teofania del roveto ardente, rivelazione del Nome divino.</td></tr>
              <tr><td>3° Quarantennio</td><td>80-120 anni</td><td>Leader / Profeta</td><td>Deserto / Monte Sinai</td><td>Piaghe, Mar Rosso, i 10 Comandamenti, peccato di Meriba.</td></tr>
              <tr><td>La fine</td><td>120 anni</td><td>Morente / Vedetta</td><td>Monte Nebo</td><td>Visione della Terra Promessa, morte e sepoltura misteriosa.</td></tr>
            </tbody>
          </table>
          <p>La narrazione si chiude con il più grande encomio che la letteratura biblica riserva a un essere umano, definendo per sempre la statura spirituale di Mosè:</p>
          <blockquote>«Non è più sorto in Israele un profeta simile a Mosè, con il quale il Signore parlava faccia a faccia.»<cite>Deuteronomio 34:10</cite></blockquote>

          <h3>Bibliografia e riferimenti</h3>
          <p>I seguenti passi biblici sono stati citati per ricostruire la cronologia e la teologia della vita di Mosè:</p>
          <ul>
            <li>Libro dell'Esodo: 2:3, 2:11-12, 3:2-4, 3:14, 14:21-22, 20:1-3</li>
            <li>Libro dei Numeri: 20:11-12</li>
            <li>Libro del Deuteronomio: 34:1-4, 34:5-7, 34:10</li>
          </ul>
        `,
          acts: [
            { label: "Introduzione", target: "intro-top", color: "#b18b33" },
            { label: "Atto I",   target: "atto-1", color: "#a15e2a" },
            { label: "Atto II",  target: "atto-2", color: "#923a24" },
            { label: "Atto III", target: "atto-3", color: "#802227" },
            { label: "Atto IV",  target: "atto-4", color: "#6e203a" },
            { label: "Epilogo",  target: "epilogo", color: "#5f1f48" }
          ]
        }
      ],
      "Nuovo Testamento": []
    }
  };
  let activeTestament = null;
  let activeEntryName = null;

  // Vista 2: lista piatta, nessuna sottodivisione
  const view2 = {
    entries: []
  };

  let currentView = 1;
  const sidebar = document.getElementById('sidebar');
  const card = document.getElementById('card');
  const tabToggle = document.getElementById('tabToggle');
  const actTabs = document.getElementById('actTabs');

  function renderCard(label, name, html, acts){
    card.innerHTML = `
      <div class="card-label">${label}</div>
      <h1>${name}</h1>
      ${html}
    `;
    card.scrollTop = 0;
    document.querySelector('.reader-inner').scrollTop = 0;
    renderActTabs(acts);
  }

  function renderActTabs(acts){
    actTabs.innerHTML = '';
    if (!acts || !acts.length) return;
    acts.forEach((act, i) => {
      const btn = document.createElement('button');
      btn.className = 'act-tab';
      btn.textContent = act.label;
      btn.style.background = act.color;
      btn.style.animationDelay = (i * 0.06) + 's';
      btn.addEventListener('click', () => {
        const target = document.getElementById(act.target);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      actTabs.appendChild(btn);
    });
  }

  function clearActive(){
    document.querySelectorAll('.entry').forEach(el => el.classList.remove('active'));
  }

  function renderEntriesList(container, testName){
    container.innerHTML = '';
    view1.testaments[testName].forEach(entry => {
      const btn = document.createElement('button');
      btn.className = 'entry entry-large' + (entry.name === activeEntryName ? ' active' : '');
      btn.textContent = entry.name;
      btn.addEventListener('click', () => {
        clearActive();
        btn.classList.add('active');
        activeEntryName = entry.name;
        renderCard(testName, entry.name, entry.text, entry.acts);
      });
      container.appendChild(btn);
    });
  }

  function renderView1(){
    sidebar.classList.remove('flat');
    sidebar.innerHTML = '';

    const switcher = document.createElement('div');
    switcher.className = 'testament-switch';

    const entriesBox = document.createElement('div');
    entriesBox.className = 'testament-entries';

    Object.keys(view1.testaments).forEach(testName => {
      const tBtn = document.createElement('div');
      tBtn.className = 'testament-btn' + (testName === activeTestament ? ' active' : '');

      const label = document.createElement('div');
      label.className = 'testament-label';
      label.innerHTML = testName.split(' ').join('<br>');
      tBtn.appendChild(label);

      const dropdown = document.createElement('div');
      dropdown.className = 'testament-dropdown';
      view1.testaments[testName].forEach(entry => {
        const preview = document.createElement('div');
        preview.className = 'dropdown-preview';
        preview.textContent = entry.name;
        dropdown.appendChild(preview);
      });
      tBtn.appendChild(dropdown);

      tBtn.addEventListener('click', () => {
        activeTestament = testName;
        activeEntryName = null;
        switcher.querySelectorAll('.testament-btn').forEach(b => b.classList.remove('active'));
        tBtn.classList.add('active');
        renderEntriesList(entriesBox, testName);
        card.innerHTML = '<div class="placeholder">Seleziona una voce dal margine per leggere il testo.</div>';
        actTabs.innerHTML = '';
      });

      switcher.appendChild(tBtn);
    });
    sidebar.appendChild(switcher);
    sidebar.appendChild(entriesBox);

    if (activeTestament) renderEntriesList(entriesBox, activeTestament);

    card.innerHTML = '<div class="placeholder">Seleziona una voce dal margine per leggere il testo.</div>';
    actTabs.innerHTML = '';
  }

  function renderView2(){
    sidebar.classList.add('flat');
    sidebar.innerHTML = '';
    view2.entries.forEach(entry => {
      const btn = document.createElement('button');
      btn.className = 'entry';
      btn.textContent = entry.name;
      btn.addEventListener('click', () => {
        clearActive();
        btn.classList.add('active');
        renderCard('', entry.name, entry.text, null);
      });
      sidebar.appendChild(btn);
    });
    card.innerHTML = '<div class="placeholder">Seleziona una voce dal margine per leggere il testo.</div>';
    actTabs.innerHTML = '';
  }

  tabToggle.addEventListener('click', () => {
    if (currentView === 1){
      currentView = 2;
      tabToggle.querySelector('.tab-label').textContent = 'Personaggi Biblici';
      renderView2();
    } else {
      currentView = 1;
      tabToggle.querySelector('.tab-label').textContent = 'Studio biblico';
      renderView1();
    }
  });

  renderView1();
</script>
